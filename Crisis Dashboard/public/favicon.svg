<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Blue gradient rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <!-- White Sun icon (lucide-style) centered -->
  <g filter="url(#softGlow)" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sun circle core -->
    <circle cx="32" cy="32" r="8" fill="white" stroke="none"/>
    <!-- 8 rays -->
    <line x1="32" y1="13" x2="32" y2="18"/>
    <line x1="32" y1="46" x2="32" y2="51"/>
    <line x1="13" y1="32" x2="18" y2="32"/>
    <line x1="46" y1="32" x2="51" y2="32"/>
    <line x1="18.6" y1="18.6" x2="22.1" y2="22.1"/>
    <line x1="41.9" y1="41.9" x2="45.4" y2="45.4"/>
    <line x1="45.4" y1="18.6" x2="41.9" y2="22.1"/>
    <line x1="22.1" y1="41.9" x2="18.6" y2="45.4"/>
  </g>
</svg>