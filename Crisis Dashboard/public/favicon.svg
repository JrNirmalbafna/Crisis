<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep dark space circle background -->
  <rect width="64" height="64" rx="16" fill="#030712" />

  <!-- Outer Solar Flare Corona Ring -->
  <circle cx="32" cy="32" r="26" fill="url(#sunGlow)" />
  <circle cx="32" cy="32" r="22" stroke="url(#flareGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />

  <!-- Orbiting Satellite Tracks -->
  <ellipse cx="32" cy="32" rx="27" ry="10" stroke="#38bdf8" stroke-width="1" opacity="0.4" transform="rotate(-30 32 32)" />
  <ellipse cx="32" cy="32" rx="27" ry="10" stroke="#f59e0b" stroke-width="1" opacity="0.4" transform="rotate(30 32 32)" />

  <!-- Central Starburst Rays -->
  <g stroke="url(#flareGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <line x1="32" y1="12" x2="32" y2="52" />
    <line x1="12" y1="32" x2="52" y2="32" />
    <line x1="18" y1="18" x2="46" y2="46" />
    <line x1="18" y1="46" x2="46" y2="18" />
  </g>

  <!-- Core Sun Body -->
  <circle cx="32" cy="32" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
  <circle cx="32" cy="32" r="5" fill="#fef08a" />

  <!-- Active Satellite Dot -->
  <circle cx="51" cy="21" r="3" fill="#38bdf8" filter="url(#glow)" />
</svg>